<style>
/* Layout: one narrow column, one question per screen, Back link on top. Matches the CENG Study Planner. Light only. */
:root{
  color-scheme:light;
  --bg:#f3f5f8; --navy:#103c6e; --navy-soft:#e9f0f8;  --card:#ffffff; --ink:#1c2529; --muted:#6b767b; --line:#e4e7e8; --soft:#f6f7f7;

  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top small{display:block;font-size:13px;color:var(--muted)}
h1{font:700 22px/1.2 var(--f);margin:0}
.reg{font-size:14px;color:var(--muted);text-align:right}
.reg b{display:block;color:var(--ink);font-weight:600}
.sample{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:14px;min-width:0}
.back{justify-self:start;font:500 14px var(--f);color:var(--blue);background:none;border:0;padding:0;cursor:pointer}
.stepno{font-size:13px;color:var(--muted)}
h2{font:600 19px/1.3 var(--f);margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.choices{display:grid;gap:8px}
.choice{display:grid;gap:2px;text-align:left;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.choice:hover{background:var(--soft)}
.choice b{font-weight:600}
.choice span{font-size:13px;color:var(--muted)}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pill{font:500 13px var(--m);padding:10px 4px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer;text-align:center;min-width:0}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.green[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.ghead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.ghead button{font:500 13px var(--f);color:var(--blue);background:none;border:0;padding:2px 0;cursor:pointer}
.primary{font:600 15px var(--f);padding:13px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer}
.primary:disabled{opacity:.35;cursor:default}
.secondary{font:500 14px var(--f);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.count{font-size:13px;color:var(--muted)}
.sec{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);text-align:left;font:inherit;color:var(--ink)}
.sec .s{font:500 13px var(--m)}
.sec .t{font-size:14px}
.sec .i{font-size:13px;color:var(--muted)}
.sec .flag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.sec[aria-pressed="true"]{background:var(--red-soft);border-color:transparent}
.sec[aria-pressed="true"] .flag{background:var(--red);color:#fff}
.verdict{display:grid;gap:4px;padding:14px 16px;border-radius:12px}
.verdict small{font-size:13px;font-weight:600}
.verdict b{font:700 22px/1.2 var(--f)}
.verdict.no{background:var(--red-soft)} .verdict.no small{color:var(--red)}
.verdict.yes{background:var(--green-soft)} .verdict.yes small{color:var(--green)}
.verdict.maybe{background:var(--blue-soft)} .verdict.maybe small{color:var(--blue)}
.reason{margin:0;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--ink)}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.code{font:500 13px var(--m)}
.tablewrap{overflow-x:auto}
.fields{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
input[type=text],textarea{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
textarea{min-height:90px;resize:vertical}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 > *{flex:1 1 auto}
.toast{font-size:13px;color:var(--green);min-height:1.2em}
.note{font-size:13px;color:var(--muted);margin:0}
hr{border:0;border-top:1px solid var(--line);margin:0}

/* LIU brand bar */
.brand{background:var(--card);border-bottom:1px solid var(--line)}
.brand-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}

// Planner logic: pure functions, no DOM.
function buildIndex(courses) {
  const byCode = {};
  courses.forEach(c => { byCode[c.code] = c; });
  // dependents: courses that need c (as prereq => +1 lag, as coreq => 0 lag)
  const deps = {};
  courses.forEach(c => { deps[c.code] = []; });
  courses.forEach(c => {
    c.prereqs.forEach(p => deps[p] && deps[p].push({ code: c.code, lag: 1 }));
    c.coreqs.forEach(p => deps[p] && deps[p].push({ code: c.code, lag: 0 }));
  });
  // height = number of further semesters this course unlocks
  const height = {};
  const h = code => {
    if (height[code] !== undefined) return height[code];
    height[code] = 0;
    let best = 0;
    deps[code].forEach(d => { best = Math.max(best, h(d.code) + d.lag); });
    height[code] = best;
    return best;
  };
  courses.forEach(c => h(c.code));
  const unlocks = {};
  const count = (code, seen) => {
    deps[code].forEach(d => { if (!seen.has(d.code)) { seen.add(d.code); count(d.code, seen); } });
    return seen;
  };
  courses.forEach(c => { unlocks[c.code] = count(c.code, new Set()).size; });
  return { byCode, height, unlocks, deps };
}

// LIU academic year: Fall (Oct) -> Spring (Feb) -> Summer (Jun/Jul), all named by the year they end in.
// "year" is that ending year: Fall 2027 starts Oct 2026.
const TERM_ORDER = ['fall', 'spring', 'summer'];
function nextTerm(t) {
  const i = TERM_ORDER.indexOf(t.term);
  return i === 2 ? { term: 'fall', year: t.year + 1 } : { term: TERM_ORDER[i + 1], year: t.year };
}

// Group = course + its pair partner + any coreqs not yet done (recursively)
function groupFor(code, idx, done) {
  const g = new Set();
  const add = c => {
    if (g.has(c) || done.has(c)) return;
    g.add(c);
    const course = idx.byCode[c];
    if (course.pairedWith) add(course.pairedWith);
    course.coreqs.forEach(add);
  };
  add(code);
  return [...g];
}

function planOnce(data, completed, opts) {
  const courses = data.courses;
  const idx = buildIndex(courses);

  let t = { term: opts.startTerm, year: opts.startYear };
  let guard = 0;
  const remaining = () => courses.filter(c => !done.has(c.code));
  while (remaining().length && guard++ < 30) {
    const isSummer = t.term === 'summer';
    if (isSummer && !opts.useSummer) { t = nextTerm(t); continue; }
    const cap = limits[t.term];
    const before = new Set(done); // state at start of term
    const taken = [];
    let credits = 0;
    const eligible = code => {
      const c = idx.byCode[code];
      if (plan.length === 0 && opts.blockFirst && opts.blockFirst.includes(code)) return false;
      return c.offered.includes(t.term) && c.prereqs.every(p => before.has(p));
    };
    const candidates = remaining().map(c => c.code).filter(eligible);
    // follow the official plan order first; courses that unlock long chains or open once a year get a boost
    const W = opts.weights || { slot: 10, height: 50, rare: 40 };
    const slot = x => { const c = idx.byCode[x]; return (c.year - 1) * 3 + { fall: 0, spring: 1, summer: 2 }[c.term]; };
    const score = x => -slot(x) * W.slot + idx.height[x] * W.height + idx.unlocks[x]
      + (idx.byCode[x].offered.length === 1 ? W.rare : 0);
    const groupScore = code => Math.max(...groupFor(code, idx, before).map(score));
    candidates.sort((a, b) => groupScore(b) - groupScore(a));
    // two passes: second pass lets a course join once its co-requisite is in this term
    for (let pass = 0; pass < 2; pass++) {
      candidates.forEach(code => {
        if (taken.includes(code)) return;
        const inTerm = new Set([...before, ...taken]);
        const g = groupFor(code, idx, inTerm);
        if (!g.every(eligible)) return;
        const cr = g.reduce((s, x) => s + idx.byCode[x].credits, 0);
        if (credits + cr <= cap) { taken.push(...g); credits += cr; }
      });
    }
    taken.forEach(x => done.add(x));
    plan.push({ term: t.term, year: t.year, courses: taken.map(x => idx.byCode[x]), credits });
    t = nextTerm(t);
  }
  // trim trailing empty terms
  while (plan.length && !plan[plan.length - 1].courses.length) plan.pop();
  tidyPlan(plan, idx, limits);
  return { plan: plan.filter(s => s.courses.length || s.term !== 'summer'), unplaced: remaining().map(c => c.code) };
}

// Move courses that unlock nothing (electives, final courses) later when that frees a summer
// or matches the official plan. Never changes the graduation term.
function tidyPlan(plan, idx, limits) {
  if (plan.length < 2) return;
  const leaf = c => !idx.deps[c.code].length && !c.pairedWith;
  const fits = (s, c) => c.offered.includes(s.term) && s.credits + c.credits <= limits[s.term];
  const move = (c, from, to) => {
    from.courses = from.courses.filter(x => x !== c); from.credits -= c.credits;
    to.courses.push(c); to.credits += c.credits;
  };
  const last = plan[plan.length - 1];
  // 1. Electives go to the final semester when there is room, as in the official plan
  plan.slice(0, -1).forEach(s => s.courses.filter(c => c.isElective).forEach(c => { if (fits(last, c)) move(c, s, last); }));
  // 2. Empty a summer if every course in it can move to a later Fall/Spring
  for (let i = plan.length - 2; i >= 0; i--) {
    const s = plan[i];
    if (s.term !== 'summer' || !s.courses.length || !s.courses.every(leaf)) continue;
    const later = plan.slice(i + 1).filter(x => x.term !== 'summer');
    const trial = later.map(x => ({ term: x.term, credits: x.credits }));
    const dest = s.courses.map(c => { for (let k = trial.length - 1; k >= 0; k--) if (fits(trial[k], c)) { trial[k].credits += c.credits; return k; } return -1; });
    if (dest.includes(-1)) continue;
    s.courses.slice().forEach((c, j) => move(c, s, later[dest[j]]));
  }
}

// Try a plan that follows the official order closely, then faster variants; keep the earliest graduation.
const WEIGHT_SETS = [
  { slot: 100, height: 10, rare: 15 },
  { slot: 30, height: 25, rare: 20 },
  { slot: 10, height: 50, rare: 40 },
  { slot: 1, height: 25, rare: 15 }
];
function planCourses(data, completed, opts) {
  const key = r => {
    if (r.unplaced.length) return 1e9;
    const last = r.plan[r.plan.length - 1];
    if (!last) return 0;
    const regular = r.plan.filter(s => s.term !== 'summer').length;
    return (last.year * 3 + { fall: 0, spring: 1, summer: 2 }[last.term]) * 100 + regular * 10 + r.plan.length;
  };
  let best = null;
  WEIGHT_SETS.forEach(w => {
    const r = planOnce(data, completed, Object.assign({}, opts, { weights: w }));
    if (!best || key(r) < key(best)) best = r;
  });
  return best;
}

// Which semester is running on a date, and which one students register for next
function currentTerm(date) {
  const m = date.getMonth() + 1, y = date.getFullYear();
  if (m >= 10) return { term: 'fall', year: y + 1 };
  if (m === 1) return { term: 'fall', year: y };
  if (m <= 6) return { term: 'spring', year: y };
  return { term: 'summer', year: y };
}


// Advising logic: pure functions, no DOM. Depends on planner-logic.js (planCourses, nextTerm).
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function overlaps(a, b) {
  if (![...a.days].some(d => b.days.includes(d))) return false;
  return toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);
}

// Find a clash-free set of sections, one per course. `full` = Set of "COURSE-SEC" to skip.
function solveSchedule(sections, courses, full) {
  const opts = courses.map(c => sections.filter(s => s.course === c && !full.has(s.course + '-' + s.section)));
  const missing = courses.filter((c, i) => !opts[i].length);
  if (missing.length) return { ok: false, missing };
  const order = courses.map((c, i) => i).sort((a, b) => opts[a].length - opts[b].length);
  const pick = [];
  const go = k => {
    if (k === order.length) return true;
    for (const s of opts[order[k]]) {
      if (pick.every(p => !overlaps(p, s))) { pick.push(s); if (go(k + 1)) return true; pick.pop(); }
    }
    return false;
  };
  if (go(0)) return { ok: true, schedule: courses.map(c => pick.find(p => p.course === c)) };
  // explain: smallest group of courses whose open sections can never fit together
  for (let i = 0; i < courses.length; i++) for (let j = i + 1; j < courses.length; j++) {
    if (opts[i].every(a => opts[j].every(b => overlaps(a, b)))) return { ok: false, clash: [courses[i], courses[j]], options: [opts[i], opts[j]] };
  }
  return { ok: false, clash: courses };
}

// Does waiting past the registration term for `code` push graduation into a later academic year?
// Summer counts: finishing in the summer of the same academic year is not a delay.
function delayImpact(data, passed, code, startTerm, startYear) {
  const c = data.courses.find(x => x.code === code);
  const done = new Set(passed);
  if (done.has(code)) return { status: 'passed' };
  if (!c.offered.includes(startTerm)) return { status: 'not-offered' };
  const missingPre = c.prereqs.filter(p => !done.has(p));
  if (missingPre.length) return { status: 'missing-prereqs', missingPre };
  const base = { startTerm, startYear, useSummer: true };
  const a = planCourses(data, passed, base);
  const b = planCourses(data, passed, Object.assign({}, base, { blockFirst: [code] }));
  const gradA = a.plan[a.plan.length - 1], gradB = b.plan[b.plan.length - 1];
  const later = b.plan.find(s => s.courses.some(x => x.code === code));
  return { status: 'ok', delays: gradB.year > gradA.year, withIt: gradA, without: gradB, takeIn: later };
}


const LABEL = {fall:'Fall',spring:'Spring',summer:'Summer'};
const DAYS = {M:'Mon',T:'Tue',W:'Wed',R:'Thu',F:'Fri',S:'Sat'};
const termName = t => `${LABEL[t.term]} ${t.year - 1}–${t.year}`;
const REG = { term: SECTIONS.term, year: SECTIONS.year };
const byCode = Object.fromEntries(DATA.courses.map(c => [c.code, c]));
const offeredCodes = DATA.courses.map(c => c.code).filter(c => SECTIONS.sections.some(s => s.course === c));
const when = s => `${[...s.days].map(d => DAYS[d]).join(' ')} ${s.start}–${s.end}`;
const store = {
  get(){ try { return JSON.parse(localStorage.getItem('ceng-advising') || 'null'); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem('ceng-advising', JSON.stringify(v)); } catch(e){} }
};
const saved = store.get() || {};
const S = { history: [], picked: new Set(), full: new Set(), course: null, passed: new Set(saved.passed || []), note: '', result: null,
  name: saved.name || '', id: saved.id || '' };
const el = document.getElementById('screen');
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function go(name){ S.history.push(name); render(); window.scrollTo({top:0}); }
function back(){ S.history.pop(); render(); }
const head = (no, title, lead) => `${S.history.length > 1 ? '<button class="back" type="button" data-act="back">← Back</button>' : ''}
  ${no ? `<div class="stepno">${no}</div>` : ''}<h2>${title}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}`;

const screens = {
  start(){
    return head('', 'Why are you visiting?', 'Pick the reason that fits best. This decides whether a forced registration or section change is possible.') + `
    <div class="choices">
      <button class="choice" type="button" data-go="conflict"><b>My courses have a time conflict</b><span>Two courses I need overlap in every section</span></button>
      <button class="choice" type="button" data-go="fullCourse"><b>A course I need is full</b><span>All sections are closed and I need it to graduate or stay on track</span></button>
      <button class="choice" type="button" data-reason="work"><b>I work at that time</b><span>I need a different section because of my job</span></button>
      <button class="choice" type="button" data-reason="pref"><b>I prefer another time or instructor</b><span>The section I got doesn't suit me</span></button>
      <button class="choice" type="button" data-go="other"><b>Something else</b><span>Describe your case for the advisor</span></button>
    </div>`;
  },
  conflict(){
    return head('Time conflict · step 1 of 2', 'Which courses do you need this semester?', 'Tap every course you want to register, labs included. The system checks all section combinations.') + `
    <div class="pills">${offeredCodes.map(c => `<button type="button" class="pill" data-pick="${c}" aria-pressed="${S.picked.has(c)}" title="${esc(byCode[c].name)}">${c}</button>`).join('')}</div>
    <div class="count">${S.picked.size} selected</div>
    <button class="primary" type="button" data-act="solve" ${S.picked.size < 2 ? 'disabled' : ''}>Check my schedule</button>`;
  },
  solved(){
    const courses = [...S.picked];
    const r = solveSchedule(SECTIONS.sections, courses, S.full);
    if (r.ok){
      return head('Time conflict · step 2 of 2', 'These sections fit together', 'Tap any section that is already full and the system will look for another combination.') + `
      <div class="choices">${r.schedule.map(s => `<button type="button" class="sec" data-full="${s.course}-${s.section}" aria-pressed="false">
        <span class="s">${s.section}</span><span><span class="s">${s.course}</span> <span class="t">${when(s)}</span><br><span class="i">${esc(s.instructor)}</span></span><span class="flag">Full?</span></button>`).join('')}</div>
      ${S.full.size ? `<p class="note">Marked full so far: ${[...S.full].join(', ')}</p>` : ''}
      <div class="row2"><button class="secondary" type="button" data-act="recheck">Recheck without full sections</button>
      <button class="primary" type="button" data-act="accept">Done, these work</button></div>`;
    }
    let reason;
    if (r.missing) reason = `Every section of ${r.missing.join(', ')} is full.`;
    else if (r.clash.length === 2) reason = `${r.clash[0]} and ${r.clash[1]} overlap in every open section: ${r.options[0].map(s => `${s.course}-${s.section} ${when(s)}`).join(', ')} vs ${r.options[1].map(s => `${s.course}-${s.section} ${when(s)}`).join(', ')}.`;
    else reason = `No combination of open sections fits ${r.clash.join(', ')} without an overlap.`;
    S.result = { decision: 'yes', title: 'Eligible for review', reason: 'Unsolvable time conflict. ' + reason, kind: 'Time conflict', courses };
    return screens.result();
  },
  fullCourse(){
    return head('Full course · step 1 of 3', 'Which course is full?') + `
    <div class="pills">${offeredCodes.map(c => `<button type="button" class="pill" data-one="${c}" aria-pressed="${S.course === c}" title="${esc(byCode[c].name)}">${c}</button>`).join('')}</div>
    <button class="primary" type="button" data-act="toSections" ${S.course ? '' : 'disabled'}>Next</button>`;
  },
  fullSections(){
    const secs = SECTIONS.sections.filter(s => s.course === S.course);
    return head('Full course · step 2 of 3', `Which ${S.course} sections are full?`, 'Check each one in UMS, then tap the full ones.') + `
    <div class="choices">${secs.map(s => `<button type="button" class="sec" data-full="${s.course}-${s.section}" aria-pressed="${S.full.has(s.course + '-' + s.section)}">
      <span class="s">${s.section}</span><span><span class="t">${when(s)}</span><br><span class="i">${esc(s.instructor)}</span></span><span class="flag">Full</span></button>`).join('')}</div>
    <button class="primary" type="button" data-act="checkFull">Next</button>`;
  },
  fullPassed(){
    const groups = [];
    DATA.courses.forEach(c => { let g = groups.find(x => x.year === c.year && x.term === c.term); if (!g) groups.push(g = {year:c.year, term:c.term, list:[]}); g.list.push(c); });
    return head('Full course · step 3 of 3', 'Which courses have you passed?', 'This shows whether waiting a semester for ' + S.course + ' delays your graduation.') +
      groups.map((g, gi) => `<div class="ghead"><span>Year ${g.year} · ${LABEL[g.term]}</span><button type="button" data-group="${g.list.map(c => c.code).join(',')}">${g.list.every(c => S.passed.has(c.code)) ? 'Untick all' : 'Tick all'}</button></div><div class="pills">${g.list.map(c => `<button type="button" class="pill green" data-passed="${c.code}" aria-pressed="${S.passed.has(c.code)}" title="${esc(c.name)}">${c.code}</button>`).join('')}</div>`).join('') + `
      <button class="primary" type="button" data-act="impact">See result</button>`;
  },
  other(){
    return head('Other', 'Describe your case', 'Keep it short. The advisor will read this with you.') + `
    <div class="field"><label for="noteBox">Your case</label><textarea id="noteBox">${esc(S.note)}</textarea></div>
    <button class="primary" type="button" data-act="otherDone">Continue</button>`;
  },
  result(){
    const r = S.result;
    const cls = r.decision === 'yes' ? 'yes' : r.decision === 'no' ? 'no' : 'maybe';
    return `${S.history.length > 1 ? '<button class="back" type="button" data-act="back">← Back</button>' : ''}
    <div class="verdict ${cls}"><small>${esc(r.kind)}</small><b>${esc(r.title)}</b></div>
    <p class="reason">${esc(r.reason)}</p>
    ${r.schedule ? `<div class="tablewrap"><table><tr><th>Course</th><th>Sec</th><th>Time</th></tr>${r.schedule.map(s => `<tr><td class="code">${s.course}</td><td>${s.section}</td><td>${when(s)}</td></tr>`).join('')}</table></div>` : ''}
    ${r.decision !== 'no' ? `<hr>
    <div class="fields">
      <div class="field"><label for="stName">Full name</label><input type="text" id="stName" value="${esc(S.name)}" autocomplete="name"></div>
      <div class="field"><label for="stId">Student ID</label><input type="text" id="stId" value="${esc(S.id)}" inputmode="numeric"></div>
    </div>
    <button class="primary" type="button" data-act="copy">Copy summary for the advisor</button>
    <p class="note">Show this screen to the advisor, or paste the summary in your message. The final decision is the advisor's.</p>
    <div class="toast" id="toast"></div>` : `<p class="note">If you think this is wrong, you can still talk to the advisor, but forced registration is not possible for this reason.</p>`}
    <button class="secondary" type="button" data-act="restart">Start over</button>`;
  }
};

function summaryText(){
  const r = S.result;
  return [`CENG Advising — ${termName(REG)}`, `Student: ${S.name || '-'} (${S.id || '-'})`, `Reason: ${r.kind}`,
    `Result: ${r.title}`, r.reason, r.courses ? `Courses: ${r.courses.join(', ')}` : '', r.note ? `Note: ${r.note}` : ''].filter(Boolean).join('\n');
}

function render(){
  const name = S.history[S.history.length - 1];
  el.innerHTML = screens[name]();
}

function setResult(r){ S.result = r; go('result'); }

el.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.act === 'back') return back();
  if (d.go){ S.picked.clear(); S.full.clear(); S.course = null; return go(d.go); }
  if (d.reason === 'work') return setResult({ decision:'no', kind:'Work schedule', title:'Not eligible',
    reason:'Sections cannot be changed or forced because of a job schedule. Choose from the open sections in UMS that fit your time.' });
  if (d.reason === 'pref') return setResult({ decision:'no', kind:'Time or instructor preference', title:'Not eligible',
    reason:'Sections cannot be changed or forced for a preferred time or instructor. You can switch yourself in UMS only to sections that still have seats.' });
  if (d.pick){ S.picked.has(d.pick) ? S.picked.delete(d.pick) : S.picked.add(d.pick); return render(); }
  if (d.one){ S.course = d.one; return render(); }
  if (d.passed){ S.passed.has(d.passed) ? S.passed.delete(d.passed) : S.passed.add(d.passed); store.set({passed:[...S.passed], name:S.name, id:S.id}); return render(); }
  if (d.group){ const codes = d.group.split(','); const allOn = codes.every(c => S.passed.has(c));
    codes.forEach(c => allOn ? S.passed.delete(c) : S.passed.add(c)); store.set({passed:[...S.passed], name:S.name, id:S.id}); return render(); }
  if (d.full){ const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on);
    on ? S.full.add(d.full) : S.full.delete(d.full); return; }
  if (d.act === 'solve'){ S.full.clear(); return go('solved'); }
  if (d.act === 'recheck') return render();
  if (d.act === 'accept'){
    const r = solveSchedule(SECTIONS.sections, [...S.picked], S.full);
    return setResult({ decision:'no', kind:'Time conflict', title:'Not eligible', courses:[...S.picked], schedule:r.schedule,
      reason:'Your courses can be taken together without any overlap. Register these sections in UMS.' });
  }
  if (d.act === 'toSections') return go('fullSections');
  if (d.act === 'checkFull'){
    const open = SECTIONS.sections.filter(s => s.course === S.course && !S.full.has(s.course + '-' + s.section));
    if (open.length) return setResult({ decision:'no', kind:'Full course', title:'Not eligible', courses:[S.course], schedule:open,
      reason:`${S.course} still has open seats. Register one of these sections in UMS.` });
    return go('fullPassed');
  }
  if (d.act === 'impact'){
    const r = delayImpact(DATA, [...S.passed], S.course, REG.term, REG.year);
    if (r.status === 'passed') return setResult({ decision:'no', kind:'Full course', title:'Not needed', courses:[S.course], reason:`You marked ${S.course} as passed.` });
    if (r.status === 'missing-prereqs') return setResult({ decision:'no', kind:'Full course', title:'Not eligible', courses:[S.course],
      reason:`You haven't passed the prerequisites for ${S.course}: ${r.missingPre.join(', ')}.` });
    if (r.delays) return setResult({ decision:'yes', kind:'Full course', title:'Eligible for review', courses:[S.course],
      reason:`All sections of ${S.course} are full, and waiting pushes your graduation from ${termName(r.withIt)} to ${termName(r.without)}.` });
    const when = r.takeIn ? termName(r.takeIn) : 'a later semester';
    return setResult({ decision:'no', kind:'Full course', title:'Not eligible', courses:[S.course],
      reason:`Register ${S.course} in ${when} instead. You can still graduate in ${termName(r.without)}, the same academic year.` });
  }
  if (d.act === 'otherDone'){ S.note = document.getElementById('noteBox').value.trim();
    return setResult({ decision:'maybe', kind:'Other', title:'See the advisor', note:S.note, reason: S.note || 'No details given.' }); }
  if (d.act === 'copy'){
    S.name = document.getElementById('stName').value.trim(); S.id = document.getElementById('stId').value.trim();
    store.set({passed:[...S.passed], name:S.name, id:S.id});
    const t = summaryText(), toast = document.getElementById('toast');
    try { await navigator.clipboard.writeText(t); toast.textContent = 'Summary copied.'; }
    catch(err){ toast.textContent = 'Copy blocked. Select the text below and copy it.'; const ta = document.createElement('textarea'); ta.value = t; ta.readOnly = true; toast.after(ta); ta.select(); }
    return;
  }
  if (d.act === 'restart'){ S.history = []; S.picked.clear(); S.full.clear(); S.course = null; S.note = ''; return go('start'); }
});

document.getElementById('regTerm').textContent = termName(REG);
document.getElementById('sampleNote').hidden = !SECTIONS.sample;
go('start');
</script>
