<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CENG Advising Tools</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f2f3f3;--card:#fff;--ink:#1c2529;--muted:#6b767b;--line:#e4e7e8;--soft:#f6f7f7;--f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px;display:grid;gap:14px}
small{font-size:13px;color:var(--muted)}h1{font:700 22px/1.2 var(--f);margin:2px 0 0}
a.choice{display:grid;gap:2px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none}
a.choice:hover{background:var(--soft)}a.choice b{font-weight:600;font-size:16px}a.choice span{font-size:14px;color:var(--muted)}
a:focus-visible{outline:2px solid #2c5d97;outline-offset:2px}
</style></head><body><div class="wrap">
<div><small>LIU · CCE Department</small><h1>CENG Advising Tools</h1></div>
<a class="choice" href="advising/"><b>Registration request</b><span>Check if a forced registration or section change is possible</span></a>
<a class="choice" href="planner/"><b>Study planner</b><span>Tick the courses you passed and get a plan to graduation</span></a>
</div></body></html>
